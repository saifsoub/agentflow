<!DOCTYPE html>
<html lang="en" x-data="app()" x-init="init()">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentFlow — AI-Powered Project Intelligence</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <!-- SortableJS for kanban drag-and-drop -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            outfit: ['Outfit', 'sans-serif'],
            manrope: ['Manrope', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            base: {
              950: '#09090b',
              900: '#111115',
              850: '#18181f',
              800: '#1e1e27',
              700: '#2d2d3a',
              600: '#3d3d4f',
            },
            violet: {
              950: '#1a0a2e',
              900: '#2d1b6e',
              800: '#3d2494',
              700: '#4f2dc8',
              600: '#6034f0',
              500: '#7c3aed',
              400: '#9461ff',
              300: '#b08aff',
              200: '#cdb5ff',
              100: '#ede5ff',
            },
            rose: { 500: '#f43f5e', 400: '#fb7185' },
            amber: { 500: '#f59e0b', 400: '#fbbf24' },
            emerald: { 500: '#10b981', 400: '#34d399' },
            sky: { 500: '#0ea5e9', 400: '#38bdf8' },
            fuchsia: { 500: '#d946ef', 400: '#e879f9' },
          },
          animation: {
            'pulse-glow': 'pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'float': 'float 3s ease-in-out infinite',
            'slide-in-right': 'slide-in-right 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94)',
            'slide-out-right': 'slide-out-right 0.3s cubic-bezier(0.55, 0.085, 0.68, 0.53)',
            'fade-in': 'fade-in 0.2s ease-out',
            'scale-in': 'scale-in 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
            'typing': 'typing 1.2s steps(3, end) infinite',
            'shimmer': 'shimmer 2s linear infinite',
          },
          keyframes: {
            'pulse-glow': {
              '0%, 100%': { boxShadow: '0 0 0 0 rgba(124, 58, 237, 0.4), 0 0 0 0 rgba(124, 58, 237, 0.2)' },
              '50%': { boxShadow: '0 0 0 4px rgba(124, 58, 237, 0.2), 0 0 20px 6px rgba(124, 58, 237, 0.1)' },
            },
            'float': {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-4px)' },
            },
            'slide-in-right': {
              from: { transform: 'translateX(100%)', opacity: '0' },
              to: { transform: 'translateX(0)', opacity: '1' },
            },
            'slide-out-right': {
              from: { transform: 'translateX(0)', opacity: '1' },
              to: { transform: 'translateX(100%)', opacity: '0' },
            },
            'fade-in': {
              from: { opacity: '0', transform: 'translateY(4px)' },
              to: { opacity: '1', transform: 'translateY(0)' },
            },
            'scale-in': {
              from: { opacity: '0', transform: 'scale(0.9)' },
              to: { opacity: '1', transform: 'scale(1)' },
            },
            'shimmer': {
              '0%': { backgroundPosition: '-200% 0' },
              '100%': { backgroundPosition: '200% 0' },
            },
          },
        },
      },
    };
  </script>

  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      background: #09090b;
      font-family: 'Manrope', sans-serif;
      color: #f4f4f5;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3d3d4f; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #7c3aed; }

    /* Kanban columns */
    .kanban-col { min-width: 280px; max-width: 280px; }
    .kanban-cards { min-height: 120px; }
    .sortable-ghost { opacity: 0.3; transform: rotate(2deg); }
    .sortable-chosen { transform: rotate(-1deg) scale(1.02); }
    .sortable-drag { transform: rotate(2deg) scale(1.05); box-shadow: 0 20px 60px rgba(124,58,237,0.4); }

    /* Card hover */
    .issue-card {
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      cursor: grab;
    }
    .issue-card:hover {
      transform: translateY(-2px);
      border-color: rgba(124, 58, 237, 0.5);
      box-shadow: 0 8px 32px rgba(124, 58, 237, 0.15), 0 0 0 1px rgba(124, 58, 237, 0.2);
    }
    .issue-card:active { cursor: grabbing; }

    /* Agent avatar glow */
    .agent-avatar {
      transition: box-shadow 0.3s ease, transform 0.2s ease;
    }
    .agent-avatar:hover { transform: scale(1.08); }
    .agent-avatar.typing {
      animation: pulse-glow 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.5), 0 0 0 0 rgba(124, 58, 237, 0.2); }
      50% { box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.3), 0 0 16px 4px rgba(124, 58, 237, 0.15); }
    }

    /* Online dot pulse */
    .online-dot {
      animation: online-pulse 2s ease-in-out infinite;
    }
    @keyframes online-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.7; }
    }

    /* Typing indicator */
    .typing-dots span {
      display: inline-block;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #9461ff;
      animation: typing-bounce 1.2s ease-in-out infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing-bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* Chat panel */
    .chat-panel {
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                  opacity 0.35s ease;
      opacity: 0;
    }
    .chat-panel.open {
      transform: translateX(0);
      opacity: 1;
    }

    /* Command palette */
    .cmd-overlay {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .cmd-item { transition: background 0.1s ease; }
    .cmd-item:hover, .cmd-item.selected { background: rgba(124, 58, 237, 0.15); }

    /* Nav item */
    .nav-item {
      transition: background 0.12s ease, color 0.12s ease;
    }
    .nav-item:hover { background: rgba(124, 58, 237, 0.1); color: #b08aff; }
    .nav-item.active { background: rgba(124, 58, 237, 0.18); color: #9461ff; }

    /* Priority badges */
    .priority-urgent { color: #f43f5e; }
    .priority-high { color: #f59e0b; }
    .priority-medium { color: #7c3aed; }
    .priority-low { color: #34d399; }

    /* Shimmer loading */
    .shimmer {
      background: linear-gradient(90deg, #18181f 25%, #2d2d3a 50%, #18181f 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s linear infinite;
    }

    /* Gradient text */
    .gradient-text {
      background: linear-gradient(135deg, #9461ff, #e879f9, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Column header accent */
    .col-backlog { border-top: 2px solid #3d3d4f; }
    .col-todo { border-top: 2px solid #38bdf8; }
    .col-progress { border-top: 2px solid #9461ff; }
    .col-review { border-top: 2px solid #fbbf24; }
    .col-done { border-top: 2px solid #34d399; }

    /* Tooltip */
    [data-tooltip] { position: relative; }
    [data-tooltip]:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: #18181f;
      border: 1px solid #3d3d4f;
      color: #f4f4f5;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      white-space: nowrap;
      z-index: 100;
      pointer-events: none;
      font-family: 'Manrope', sans-serif;
    }

    /* Input focus */
    input:focus, textarea:focus {
      outline: none;
      box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.4);
    }

    /* Scrollable kanban area */
    .kanban-scroll {
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 16px;
    }
    .kanban-inner {
      display: flex;
      gap: 16px;
      padding: 0 24px 24px;
      min-width: max-content;
    }
    .kanban-col-cards {
      overflow-y: auto;
      max-height: calc(100vh - 200px);
    }

    /* Issue detail panel */
    .detail-panel {
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .detail-panel.open { transform: translateX(0); }

    /* Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Selection highlight */
    ::selection { background: rgba(124, 58, 237, 0.3); }

    /* Sidebar resize handle */
    .sidebar { flex-shrink: 0; }
  </style>
</head>
<body class="flex h-screen overflow-hidden" style="background:#09090b;">

<!-- ═══════════════════════════════════════ COMMAND PALETTE ═══ -->
<div x-show="cmdOpen" x-cloak
     class="cmd-overlay fixed inset-0 z-50 flex items-start justify-center pt-24"
     style="background: rgba(9,9,11,0.7);"
     @click.self="cmdOpen = false"
     @keydown.escape.window="cmdOpen = false">

  <div class="w-[600px] rounded-2xl overflow-hidden shadow-2xl animate-scale-in"
       style="background:#111115; border:1px solid #3d3d4f;">

    <!-- Search input -->
    <div class="flex items-center gap-3 px-4 py-3.5 border-b" style="border-color:#2d2d3a;">
      <i data-lucide="search" class="w-4 h-4" style="color:#7c3aed; flex-shrink:0;"></i>
      <input x-model="cmdQuery" x-ref="cmdInput"
             @keydown.arrow-down.prevent="cmdIndex = Math.min(cmdIndex+1, filteredCommands.length-1)"
             @keydown.arrow-up.prevent="cmdIndex = Math.max(cmdIndex-1, 0)"
             @keydown.enter="runCommand(filteredCommands[cmdIndex])"
             type="text" placeholder="Type a command or search..."
             class="flex-1 bg-transparent text-sm outline-none"
             style="color:#f4f4f5; font-family:'Manrope',sans-serif;" />
      <kbd class="text-xs px-2 py-1 rounded" style="background:#1e1e27; color:#9461ff; font-family:'JetBrains Mono',monospace;">ESC</kbd>
    </div>

    <!-- Commands -->
    <div class="py-2 max-h-80 overflow-y-auto">
      <template x-for="(group, gi) in groupedCommands" :key="gi">
        <div>
          <div class="px-4 py-1.5 text-xs font-semibold uppercase tracking-widest" style="color:#6034f0; font-family:'JetBrains Mono',monospace;" x-text="group.label"></div>
          <template x-for="(cmd, ci) in group.items" :key="ci">
            <div class="cmd-item flex items-center gap-3 px-4 py-2.5 cursor-pointer rounded-lg mx-2"
                 :class="{ 'selected': flatIndex(gi, ci) === cmdIndex }"
                 @click="runCommand(cmd)"
                 @mouseenter="cmdIndex = flatIndex(gi, ci)">
              <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0"
                   :style="`background:${cmd.color}20; color:${cmd.color};`">
                <i :data-lucide="cmd.icon" class="w-4 h-4"></i>
              </div>
              <div class="flex-1 min-w-0">
                <div class="text-sm font-medium" style="color:#f4f4f5;" x-text="cmd.title"></div>
                <div class="text-xs" style="color:#6b7280;" x-text="cmd.description"></div>
              </div>
              <template x-if="cmd.shortcut">
                <kbd class="text-xs px-2 py-1 rounded" style="background:#1e1e27; color:#9461ff; font-family:'JetBrains Mono',monospace;" x-text="cmd.shortcut"></kbd>
              </template>
            </div>
          </template>
        </div>
      </template>
    </div>

    <!-- Footer -->
    <div class="px-4 py-2 flex items-center gap-4 border-t text-xs" style="border-color:#2d2d3a; color:#6b7280;">
      <span><kbd class="font-mono">↑↓</kbd> navigate</span>
      <span><kbd class="font-mono">↵</kbd> select</span>
      <span><kbd class="font-mono">ESC</kbd> close</span>
      <span class="ml-auto gradient-text font-semibold">AgentFlow AI</span>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════ NEW ISSUE MODAL ═══ -->
<div x-show="newIssueOpen" x-cloak
     class="fixed inset-0 z-50 flex items-center justify-center"
     style="background: rgba(9,9,11,0.8); backdrop-filter:blur(8px);"
     @click.self="newIssueOpen = false">

  <div class="w-[560px] rounded-2xl overflow-hidden shadow-2xl animate-scale-in"
       style="background:#111115; border:1px solid #3d3d4f;">

    <div class="px-6 py-4 border-b flex items-center justify-between" style="border-color:#2d2d3a;">
      <div>
        <h2 class="text-base font-semibold" style="font-family:'Outfit',sans-serif; color:#f4f4f5;">New Issue</h2>
        <p class="text-xs mt-0.5" style="color:#6b7280;">Your AI agents are ready to jump on it 🚀</p>
      </div>
      <button @click="newIssueOpen = false" class="p-1.5 rounded-lg hover:bg-white/5 transition-colors">
        <i data-lucide="x" class="w-4 h-4" style="color:#9ca3af;"></i>
      </button>
    </div>

    <div class="p-6 space-y-4">
      <input x-model="newIssue.title" type="text" placeholder="Issue title..."
             class="w-full text-base bg-transparent border-b pb-2 outline-none placeholder-gray-600"
             style="color:#f4f4f5; border-color:#2d2d3a; font-family:'Outfit',sans-serif;" />

      <textarea x-model="newIssue.description" placeholder="Add a description (optional)..."
                rows="3"
                class="w-full text-sm bg-transparent rounded-lg p-3 outline-none placeholder-gray-600 resize-none"
                style="color:#d4d4d8; border:1px solid #2d2d3a; font-family:'Manrope',sans-serif;"></textarea>

      <div class="flex gap-3">
        <!-- Priority -->
        <div class="flex-1">
          <label class="text-xs font-medium block mb-1.5" style="color:#6b7280;">Priority</label>
          <select x-model="newIssue.priority"
                  class="w-full text-sm rounded-lg px-3 py-2 outline-none"
                  style="background:#18181f; border:1px solid #2d2d3a; color:#f4f4f5;">
            <option value="urgent">🔴 Urgent</option>
            <option value="high">🟠 High</option>
            <option value="medium" selected>🟣 Medium</option>
            <option value="low">🟢 Low</option>
          </select>
        </div>
        <!-- Assignee -->
        <div class="flex-1">
          <label class="text-xs font-medium block mb-1.5" style="color:#6b7280;">Assign Agent</label>
          <select x-model="newIssue.assignee"
                  class="w-full text-sm rounded-lg px-3 py-2 outline-none"
                  style="background:#18181f; border:1px solid #2d2d3a; color:#f4f4f5;">
            <option value="">Unassigned</option>
            <template x-for="agent in agents" :key="agent.id">
              <option :value="agent.id" x-text="agent.name"></option>
            </template>
          </select>
        </div>
        <!-- Status -->
        <div class="flex-1">
          <label class="text-xs font-medium block mb-1.5" style="color:#6b7280;">Status</label>
          <select x-model="newIssue.status"
                  class="w-full text-sm rounded-lg px-3 py-2 outline-none"
                  style="background:#18181f; border:1px solid #2d2d3a; color:#f4f4f5;">
            <option value="backlog">Backlog</option>
            <option value="todo">Todo</option>
            <option value="in_progress">In Progress</option>
            <option value="review">In Review</option>
            <option value="done">Done</option>
          </select>
        </div>
      </div>
    </div>

    <div class="px-6 pb-5 flex gap-3 justify-end">
      <button @click="newIssueOpen = false"
              class="px-4 py-2 rounded-lg text-sm font-medium transition-colors"
              style="background:#1e1e27; color:#a1a1aa;">Cancel</button>
      <button @click="createIssue()"
              class="px-5 py-2 rounded-lg text-sm font-semibold transition-all"
              style="background:linear-gradient(135deg,#7c3aed,#6034f0); color:white; box-shadow:0 4px 20px rgba(124,58,237,0.4);">
        Create Issue ✨
      </button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════ MAIN LAYOUT ═══ -->
<div class="flex h-screen w-screen overflow-hidden">

  <!-- ──────────── SIDEBAR ──────────── -->
  <aside class="sidebar flex flex-col h-full" style="width:220px; background:#0a0a0f; border-right:1px solid #1e1e27;">

    <!-- Logo -->
    <div class="px-4 pt-5 pb-3 flex items-center gap-2.5">
      <div class="w-7 h-7 rounded-lg flex items-center justify-center flex-shrink-0"
           style="background:linear-gradient(135deg,#7c3aed,#6034f0);">
        <i data-lucide="zap" class="w-4 h-4" style="color:white;"></i>
      </div>
      <span class="font-bold text-base" style="font-family:'Outfit',sans-serif; color:#f4f4f5;">AgentFlow</span>
    </div>

    <!-- Workspace selector -->
    <div class="mx-3 mb-4 px-3 py-2 rounded-lg cursor-pointer flex items-center gap-2 hover:bg-white/5 transition-colors">
      <div class="w-5 h-5 rounded flex items-center justify-center text-xs font-bold"
           style="background:linear-gradient(135deg,#7c3aed,#e879f9); color:white;">S</div>
      <span class="text-sm font-medium flex-1 truncate" style="color:#d4d4d8;">Saif's Workspace</span>
      <i data-lucide="chevrons-up-down" class="w-3.5 h-3.5" style="color:#6b7280;"></i>
    </div>

    <!-- Nav links -->
    <nav class="flex-1 px-2 space-y-0.5 overflow-y-auto">
      <!-- Main -->
      <div class="px-2 py-1 text-xs font-semibold uppercase tracking-widest mb-1" style="color:#4f4f6a; font-family:'JetBrains Mono',monospace;">Main</div>

      <template x-for="item in navItems" :key="item.id">
        <button @click="activeView = item.id"
                :class="{ 'active': activeView === item.id }"
                class="nav-item w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm text-left"
                style="color:#a1a1aa; font-family:'Manrope',sans-serif;">
          <i :data-lucide="item.icon" class="w-4 h-4 flex-shrink-0"></i>
          <span x-text="item.label" class="flex-1"></span>
          <template x-if="item.count">
            <span class="text-xs font-bold px-1.5 py-0.5 rounded-full"
                  style="background:#2d2d3a; color:#9461ff; font-family:'JetBrains Mono',monospace;"
                  x-text="item.count"></span>
          </template>
        </button>
      </template>

      <!-- Agents -->
      <div class="px-2 py-1 text-xs font-semibold uppercase tracking-widest mt-3 mb-1" style="color:#4f4f6a; font-family:'JetBrains Mono',monospace;">Agents</div>

      <template x-for="agent in agents" :key="agent.id">
        <button @click="openAgentChat(agent)"
                class="nav-item w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm text-left"
                style="color:#a1a1aa; font-family:'Manrope',sans-serif;">
          <div class="relative">
            <img :src="agent.avatar" :alt="agent.name"
                 class="agent-avatar w-5 h-5 rounded-full object-cover"
                 :class="{ 'typing': agent.typing }" />
            <div class="online-dot absolute -bottom-0.5 -right-0.5 w-2 h-2 rounded-full border"
                 :style="`background:${agent.statusColor}; border-color:#0a0a0f;`"></div>
          </div>
          <span x-text="agent.name" class="flex-1 truncate"></span>
          <template x-if="agent.typing">
            <div class="typing-dots flex gap-0.5 items-end h-3">
              <span></span><span></span><span></span>
            </div>
          </template>
        </button>
      </template>
    </nav>

    <!-- Bottom user area -->
    <div class="p-3 border-t" style="border-color:#1e1e27;">
      <div class="flex items-center gap-2.5 px-2 py-2 rounded-lg cursor-pointer hover:bg-white/5 transition-colors">
        <img src="https://api.dicebear.com/7.x/notionists/svg?seed=saif&backgroundColor=b6e3f4,c0aede&backgroundType=gradientLinear"
             class="w-7 h-7 rounded-full object-cover" />
        <div class="flex-1 min-w-0">
          <div class="text-sm font-medium truncate" style="color:#f4f4f5; font-family:'Manrope',sans-serif;">Saif</div>
          <div class="text-xs truncate" style="color:#6b7280;">Admin</div>
        </div>
        <i data-lucide="settings" class="w-3.5 h-3.5" style="color:#6b7280;"></i>
      </div>
    </div>
  </aside>

  <!-- ──────────── MAIN CONTENT ──────────── -->
  <main class="flex-1 flex flex-col min-w-0 overflow-hidden">

    <!-- Top bar -->
    <header class="flex items-center gap-4 px-6 py-3 border-b flex-shrink-0"
            style="background:#09090b; border-color:#1e1e27;">

      <!-- Breadcrumb -->
      <div class="flex items-center gap-2 text-sm" style="color:#6b7280;">
        <span style="color:#f4f4f5; font-family:'Outfit',sans-serif; font-weight:600;">
          <span x-text="currentViewLabel"></span>
        </span>
        <span>/</span>
        <span style="color:#9461ff; font-family:'JetBrains Mono',monospace; font-size:12px;" x-text="currentProject"></span>

        { id: 3, role: 'agent', agentId: 'aria', text: "On it! I see PROJ-005 is already in review. The token storage now uses httpOnly cookies — much more secure. I'll write up the security notes.", time: '10:34 AM' },
      ],
      nova: [
        { id: 1, role: 'agent', agentId: 'nova', text: "The design token system is coming along beautifully ✨ I'm using CSS custom properties for the full theming layer.", time: '9:15 AM' },
        { id: 2, role: 'user', text: "Love it! Will it support dark/light toggle?", time: '9:17 AM' },
        { id: 3, role: 'agent', agentId: 'nova', text: "Absolutely! And I'm adding a high-contrast mode for accessibility. ETA: tomorrow. 🎨", time: '9:18 AM' },
      ],
      zyx: [
        { id: 1, role: 'agent', agentId: 'zyx', text: "Cluster auto-scaling is set up. HPA on CPU > 70%, scales to 10 pods max ⚙️", time: '11:00 AM' },
        { id: 2, role: 'user', text: "Perfect. What about the DB migration?", time: '11:02 AM' },
        { id: 3, role: 'agent', agentId: 'zyx', text: "Running in blue-green mode. Rolling back takes 30s if needed. Should be safe. 💪", time: '11:03 AM' },
      ],
      echo: [
        { id: 1, role: 'agent', agentId: 'echo', text: "Payment service tests passing: 97/97 ✅ Found 2 edge cases in the refund flow though!", time: '8:45 AM' },
        { id: 2, role: 'user', text: "Good catch. File tickets for those?", time: '8:47 AM' },
        { id: 3, role: 'agent', agentId: 'echo', text: "Done — PROJ-098 and PROJ-099. Starting WCAG audit now. 🧪", time: '8:48 AM' },
      ],
    },

    // Command palette
    commands: [
      { group: 'Create', icon: 'plus-circle', title: 'New Issue', description: 'Create a new issue', shortcut: 'C', color: '#9461ff', action: () => { this.newIssueOpen = true; this.cmdOpen = false; } },
      { group: 'Create', icon: 'folder-plus', title: 'New Project', description: 'Start a new project', color: '#38bdf8', action: () => { this.cmdOpen = false; } },
      { group: 'Navigate', icon: 'layout-kanban', title: 'Go to Board', description: 'Switch to Kanban view', shortcut: 'B', color: '#fbbf24', action: () => { this.activeTab = 'board'; this.cmdOpen = false; } },
      { group: 'Navigate', icon: 'list', title: 'Go to List', description: 'Switch to List view', shortcut: 'L', color: '#fbbf24', action: () => { this.activeTab = 'list'; this.cmdOpen = false; } },
      { group: 'Navigate', icon: 'bar-chart-2', title: 'Open Analytics', description: 'View project analytics', color: '#34d399', action: () => { this.cmdOpen = false; } },
      { group: 'Agents', icon: 'bot', title: 'Chat with Aria', description: 'Backend & APIs specialist', color: '#9461ff', action: () => { this.openAgentChat(this.agents[0]); this.cmdOpen = false; } },
      { group: 'Agents', icon: 'bot', title: 'Chat with Nova', description: 'Frontend & design wizard', color: '#e879f9', action: () => { this.openAgentChat(this.agents[1]); this.cmdOpen = false; } },
      { group: 'Agents', icon: 'bot', title: 'Chat with Zyx', description: 'DevOps & infrastructure', color: '#38bdf8', action: () => { this.openAgentChat(this.agents[2]); this.cmdOpen = false; } },
      { group: 'Agents', icon: 'bot', title: 'Chat with Echo', description: 'QA & testing master', color: '#34d399', action: () => { this.openAgentChat(this.agents[3]); this.cmdOpen = false; } },
    ],

    get stats() {
      const urgent = this.issues.filter(i => i.priority === 'urgent' && i.status !== 'done').length;
      const inProg = this.issues.filter(i => i.status === 'in_progress').length;
      const done = this.issues.filter(i => i.status === 'done').length;
      return [
        { label: 'urgent', count: urgent, icon: 'alert-circle', color: '#f43f5e' },
        { label: 'in progress', count: inProg, icon: 'loader', color: '#9461ff' },
        { label: 'done', count: done, icon: 'check-circle-2', color: '#34d399' },
      ];
    },

    get currentViewLabel() {
      const map = { board: 'Board', list: 'List', inbox: 'Inbox', issues: 'My Issues', cycles: 'Cycles', roadmap: 'Roadmap', analytics: 'Analytics' };
      return map[this.activeView] || 'Board';
    },

    get currentChat() {
      return this.chatHistory[this.selectedAgent] || [];
    },

    get filteredCommands() {
      if (!this.cmdQuery) return this.commands;
      const q = this.cmdQuery.toLowerCase();
      return this.commands.filter(c => c.title.toLowerCase().includes(q) || c.description.toLowerCase().includes(q));
    },

    get groupedCommands() {
      const groups = {};
      this.filteredCommands.forEach(cmd => {
        if (!groups[cmd.group]) groups[cmd.group] = [];
        groups[cmd.group].push(cmd);
      });
      return Object.entries(groups).map(([label, items]) => ({ label, items }));
    },

    flatIndex(gi, ci) {
      let idx = 0;
      for (let g = 0; g < gi; g++) idx += this.groupedCommands[g].items.length;
      return idx + ci;
    },

    getColIssues(colId) {
      return this.issues.filter(i => i.status === colId);
    },

    getAgent(id) {
      return this.agents.find(a => a.id === id);
    },

    priorityIcon(p) {
      const map = { urgent: 'alert-circle', high: 'arrow-up', medium: 'minus', low: 'arrow-down' };
      return map[p] || 'minus';
    },

    labelColor(label) {
      const map = {
        Design: '#e879f9', Frontend: '#38bdf8', Backend: '#9461ff',
        Security: '#f43f5e', DevOps: '#fbbf24', Infra: '#fbbf24',
        Testing: '#34d399', QA: '#34d399', A11y: '#10b981',
        Feature: '#6034f0', DB: '#f59e0b', UX: '#d946ef',
      };
      return map[label] || '#9461ff';
    },

    openCmd() {
      this.cmdOpen = true;
      this.$nextTick(() => {
        if (this.$refs.cmdInput) this.$refs.cmdInput.focus();
      });
    },

    runCommand(cmd) {
      if (cmd && cmd.action) cmd.action();
    },

    openAgentChat(agent) {
      this.selectedAgent = agent.id;
      this.chatOpen = true;
    },

    openIssue(issue) {
      // Could open detail panel - for now just toggle assignee typing
      const agent = this.getAgent(issue.assignee);
      if (agent) {
        agent.typing = true;
        setTimeout(() => { agent.typing = false; }, 3000);
      }
    },

    createIssue() {
      if (!this.newIssue.title.trim()) return;
      this.issueCounter++;
      const issue = {
        id: `PROJ-${String(this.issueCounter).padStart(3,'0')}`,
        title: this.newIssue.title,
        priority: this.newIssue.priority,
        assignee: this.newIssue.assignee || null,
        status: this.newIssue.status,
        labels: [],
        comments: 0,
        date: 'Jun 6',
      };
      this.issues.push(issue);
      this.newIssueOpen = false;
      this.newIssue = { title: '', description: '', priority: 'medium', assignee: '', status: 'backlog' };
    },

    sendMessage() {
      const text = this.chatInput.trim();
      if (!text) return;

      const msgId = Date.now();
      if (!this.chatHistory[this.selectedAgent]) this.chatHistory[this.selectedAgent] = [];

      this.chatHistory[this.selectedAgent].push({
        id: msgId,
        role: 'user',
        text,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
      });

      this.chatInput = '';
      this.agentTyping = true;

      // Scroll to bottom
      this.$nextTick(() => {
        if (this.$refs.chatMessages) {
          this.$refs.chatMessages.scrollTop = this.$refs.chatMessages.scrollHeight;
        }
      });

      // Simulate agent response
      const agent = this.getAgent(this.selectedAgent);
      if (agent) agent.typing = true;

      const responses = {
        aria: ["On it! I'll check the code and get back to you ASAP. 🔧", "Great idea! Let me investigate the API internals real quick.", "Sure thing. I'll push a fix within the hour. 🚀", "Interesting edge case! Adding it to my backlog now."],
        nova: ["Love that idea! I'll prototype it in Figma first. ✨", "On it! CSS variables to the rescue. 🎨", "Already thinking of 3 different approaches. Let me sketch them out!", "That component could be so clean. Give me a few minutes!"],
        zyx: ["Running diagnostics now... ⚙️", "Cluster metrics look healthy. No alerts in the last 24h.", "I'll set up a canary deployment for that. Safer rollout.", "Scaling policies updated. Alerts configured. 💪"],
        echo: ["Test coverage on that is only 60%. I'll add more cases. 🧪", "Found a regression! Fixing it now before it hits production.", "All green! 97 tests passing, 0 failures. ✅", "Running load tests on the new endpoint. ETA: 20 mins."],
      };

      setTimeout(() => {
        agent.typing = false;
        this.agentTyping = false;
        const pool = responses[this.selectedAgent] || responses.aria;
        const reply = pool[Math.floor(Math.random() * pool.length)];

        this.chatHistory[this.selectedAgent].push({
          id: Date.now(),
          role: 'agent',
          agentId: this.selectedAgent,
          text: reply,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        });

        this.$nextTick(() => {
          if (this.$refs.chatMessages) {
            this.$refs.chatMessages.scrollTop = this.$refs.chatMessages.scrollHeight;
          }
        });
      }, 1200 + Math.random() * 800);
    },

    init() {
      // Global keyboard shortcut
      document.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
          e.preventDefault();
          this.openCmd();
        }
        if (e.key === 'c' && !this.cmdOpen && !this.newIssueOpen && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
          this.newIssueOpen = true;
        }
      });

      // Simulate typing agents
      setTimeout(() => {
        this.agents[0].typing = true;
        setTimeout(() => { this.agents[0].typing = false; }, 3500);
      }, 2000);

      setTimeout(() => {
        this.agents[2].typing = true;
        setTimeout(() => { this.agents[2].typing = false; }, 2800);
      }, 5000);

      // Init icons after DOM
      this.$nextTick(() => {
        lucide.createIcons();
        this.initKanban();
      });
    },

    initKanban() {
      this.$nextTick(() => {
        const cols = document.querySelectorAll('.kanban-cards');
        cols.forEach(col => {
          Sortable.create(col, {
            group: 'kanban',
            animation: 200,
            ghostClass: 'sortable-ghost',
            chosenClass: 'sortable-chosen',
            dragClass: 'sortable-drag',
            onEnd: (evt) => {
              const issueId = evt.item.dataset.id;
              const newStatus = evt.to.dataset.col;
              const issue = this.issues.find(i => i.id === issueId);
              if (issue) {
                issue.status = newStatus;
                // Re-init icons after DOM change
                this.$nextTick(() => lucide.createIcons());
              }
            },
          });
        });
      });
    },
  };
}
</script>

<!-- Re-init lucide icons whenever Alpine updates DOM -->
<script>
  document.addEventListener('alpine:initialized', () => {
    // Watch for mutations and re-init icons
    const observer = new MutationObserver(() => {
      if (typeof lucide !== 'undefined') lucide.createIcons();
    });
    observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['data-lucide'] });
  });
</script>
